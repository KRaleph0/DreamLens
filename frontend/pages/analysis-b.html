<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기간별 패턴 분석 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1" style="max-width: 800px;">
        <div class="mb-4 text-center">
            <h3 class="fw-bold">📊 기간별 패턴 분석</h3>
            <p class="text-secondary small">일정 기간 동안의 꿈 패턴을 통계와 함께 종합적으로 분석합니다.</p>
        </div>

        <div class="card bg-dark border-secondary mb-4 shadow-sm" style="transform: none !important;">
            <div class="card-body p-4">
                <h5 class="fw-bold text-info mb-3">🗓️ 분석 기간 선택</h5>

                <div class="btn-group w-100" role="group" aria-label="기간 선택">
                    <input type="radio" class="btn-check" name="period" id="period-1w" value="1w" autocomplete="off"
                        checked>
                    <label class="btn btn-outline-primary" for="period-1w">최근 1주일</label>

                    <input type="radio" class="btn-check" name="period" id="period-1m" value="1m" autocomplete="off">
                    <label class="btn btn-outline-primary" for="period-1m">최근 1개월</label>

                    <input type="radio" class="btn-check" name="period" id="period-3m" value="3m" autocomplete="off">
                    <label class="btn btn-outline-primary" for="period-3m">최근 3개월</label>
                </div>
                <div id="missing-dream-alert" class="mt-3 text-warning small d-none">
                    ⚠️ 선택한 기간 중 분석(Task A)을 거치지 않은 꿈이 <span id="missing-count" class="fw-bold">0</span>건 있어 통계에서 제외됩니다.
                </div>
            </div>
        </div>

        <div class="card bg-dark border-secondary mb-4 shadow-sm" style="transform: none !important;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-end mb-3 flex-wrap gap-2">
                    <div>
                        <h5 class="fw-bold text-warning mb-1">☀️ 결합할 경험 선택</h5>
                        <small class="text-secondary">거시적인 패턴 분석에 현실 맥락을 더합니다.</small>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <input type="date" id="exp-date-filter"
                            class="form-control form-control-sm bg-dark text-light border-secondary shadow-sm"
                            style="width: auto;">
                        <button class="btn btn-sm btn-outline-secondary" id="btn-clear-filter">초기화</button>
                    </div>
                </div>

                <div id="exp-selection-list" class="d-flex flex-column gap-2 mb-3">
                    <div class="text-center py-3 text-secondary small">로딩 중...</div>
                </div>

                <div class="border border-secondary rounded p-3 bg-black">
                    <div class="d-flex justify-content-between align-items-end mb-2">
                        <small class="text-secondary">토큰 예산 현황</small>
                        <div>
                            <span id="used-tokens" class="fw-bold text-info fs-5">0</span>
                            <span class="text-secondary"> / <span id="total-budget-display">1500</span> 토큰</span>
                            <span id="compress-count-badge" class="badge bg-warning text-dark ms-2 d-none"></span>
                        </div>
                    </div>
                    <div class="progress" style="height: 10px; background-color: #333;">
                        <div id="budget-bar" class="progress-bar bg-info" role="progressbar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <button id="btn-start-analysis" class="btn btn-primary-custom w-100 py-3 fw-bold fs-5 shadow-sm mb-5">
            선택한 기간과 경험으로 패턴 분석하기
        </button>

        <div id="analysis-result-section" class="d-none mb-5">
            <h3 class="fw-bold text-center text-primary-custom mb-4">✨ 기간별 분석 리포트</h3>

            <div class="row g-4 mb-4">
                <div class="col-md-7">
                    <div class="card bg-dark border-secondary h-100 shadow-sm" style="transform: none !important;">
                        <div class="card-body">
                            <h6 class="fw-bold text-info mb-3">📌 주요 등장 키워드 Top 5</h6>
                            <canvas id="keywordBarChart" style="max-height: 300px;"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="card bg-dark border-secondary h-100 shadow-sm" style="transform: none !important;">
                        <div class="card-body d-flex flex-column align-items-center">
                            <h6 class="fw-bold text-warning mb-3">🎭 꿈 카테고리 분포</h6>
                            <canvas id="categoryDoughnutChart" style="max-height: 250px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card bg-dark border-primary shadow-sm mb-4" style="transform: none !important;">
                <div class="card-body p-4">
                    <h5 class="fw-bold text-primary-custom mb-3">🤖 AI 종합 해석</h5>
                    <div id="ai-synthesis-result" class="text-light-emphasis" style="line-height: 1.8;">
                        로딩 중...
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/analysis-b.js?v=2"></script>
</body>

</html>
