<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심층 해석 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* 경험 선택 카드 호버 및 선택 효과 */
        .exp-select-card {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
        }

        .exp-select-card:hover {
            background-color: #2b2f36 !important;
            border-color: #ffc107 !important;
        }

        .exp-select-card.selected {
            background-color: #332d20 !important;
            border-color: #ffc107 !important;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.2);
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1 max-w-md" style="max-width: 800px;">
        <div class="mb-4 d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="history.back()">←</button>
            <h2 class="fw-bold mb-0 text-info">🔍 심층 해석 준비</h2>
        </div>

        <p class="text-secondary mb-4">꿈과 가장 깊게 연관되어 있다고 생각되는 실생활 경험을 하나 선택해 주세요.</p>

        <div class="mb-5">
            <h5 class="fw-bold text-primary-custom mb-3">🌙 분석할 꿈</h5>
            <div id="target-dream-container" class="card bg-dark border-primary p-3 shadow-sm">
            </div>
        </div>

        <div class="mb-5">
            <h5 class="fw-bold text-warning mb-3">☀️ 결합할 경험 선택</h5>
            <div id="exp-selection-list" class="d-flex flex-column gap-2">
                <div class="text-center py-4 text-secondary small">로딩 중...</div>
            </div>
        </div>

        <div class="text-center mb-5 pb-5">
            <button id="btn-start-analysis" class="btn btn-info btn-lg rounded-pill px-5 fw-bold shadow disabled"
                style="color: #111;">
                선택한 경험과 결합하여 심층 해석하기
            </button>
        </div>
    </main>

    <div class="modal fade" id="taskDModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark border-info">
                <div class="modal-header border-secondary-subtle">
                    <h5 class="modal-title text-info fw-bold">🔍 심층 해석 결과</h5>
                    <button type="button" class="btn-close btn-close-white"
                        onclick="location.href='../index.html'"></button>
                </div>
                <div class="modal-body p-4 p-md-5">

                    <div id="taskD-loading" class="text-center py-5">
                        <div class="spinner-border text-info mb-4" style="width: 3rem; height: 3rem;" role="status">
                        </div>
                        <h5 class="text-light fw-bold">꿈과 현실을 연결하고 있습니다...</h5>
                        <p class="text-secondary mb-0">당신의 무의식 속에 숨겨진 진짜 메시지를 해독 중입니다.</p>
                    </div>

                    <div id="taskD-result" class="d-none">
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <div class="p-3 bg-dark border border-primary border-opacity-50 rounded h-100">
                                    <span class="badge bg-primary mb-2">🌙 꿈 키워드</span>
                                    <div id="result-dream-kw" class="d-flex flex-wrap gap-1"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="p-3 bg-dark border border-warning border-opacity-50 rounded h-100">
                                    <span class="badge bg-warning text-dark mb-2">☀️ 현실 경험 연관성</span>
                                    <p id="result-exp-link" class="small text-light-emphasis mb-0"></p>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h5 class="fw-bold text-info mb-3">📖 심층 해석 리포트</h5>
                            <div class="p-4 bg-dark border border-secondary rounded text-light-emphasis"
                                style="line-height: 1.8;">
                                <p id="result-summary" class="mb-0"></p>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <button class="btn btn-outline-info px-4" onclick="location.href='../index.html'">메인으로
                                돌아가기</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/analysis-d.js"></script>
</body>

</html>
