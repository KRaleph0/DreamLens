<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전체 분석 리포트 목록 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1" style="max-width: 800px;">

        <div class="mb-4 d-flex justify-content-between align-items-end flex-wrap gap-3">
            <div>
                <h3 class="fw-bold mb-1">📋 전체 분석 리포트 목록</h3>
                <p class="text-secondary small mb-0">AI가 도출한 나의 무의식 및 패턴 분석 이력입니다.</p>
            </div>

            <div>
                <select id="analysis-sort-select"
                    class="form-select form-select-sm bg-dark text-light border-secondary shadow-sm"
                    style="width: auto;">
                    <option value="latest" selected>최신 분석순</option>
                    <option value="oldest">오래된 분석순</option>
                </select>
            </div>
        </div>

        <div id="analysis-full-list" class="d-flex flex-column gap-2 mb-5">
            <div class="text-center py-5 text-secondary small">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                분석 이력을 불러오는 중입니다...
            </div>
        </div>

    </main>

    <footer class="text-center py-3 bg-black text-secondary small mt-auto">
        본 해석은 AI 기반이며, 전문적 심리 상담을 대체하지 않습니다.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/analysis-list.js"></script>
</body>

</html>
