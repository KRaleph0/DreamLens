<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 분석 리포트 상세 보기 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1" style="max-width: 800px;">

        <div class="mb-4">
            <button class="btn btn-sm btn-outline-secondary" onclick="location.href='analysis-list.html'">
                &lt; 목록으로 돌아가기
            </button>
        </div>

        <div class="card bg-dark border-secondary mb-4 shadow-sm" style="transform: none !important;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                    <span id="analysis-type-badge" class="badge bg-primary fs-6">AI 분석 리포트</span>
                    <span id="analysis-date" class="text-secondary small">2026.06.03</span>
                </div>
                <h3 id="analysis-title" class="fw-bold text-light mb-0">로딩 중...</h3>
            </div>
        </div>

        <div class="card bg-dark border-secondary mb-4 shadow-sm" style="transform: none !important;">
            <div class="card-body p-4">
                <h5 class="fw-bold text-info mb-3">🌙 내가 기록한 꿈 원문</h5>
                <p id="original-dream-content"
                    class="text-light-emphasis bg-black p-3 rounded border border-secondary small mb-0"
                    style="line-height: 1.8; white-space: pre-wrap;">
                    불러오는 중...
                </p>
            </div>
        </div>

        <div id="combined-experience-section" class="card bg-dark border-secondary mb-4 shadow-sm d-none"
            style="transform: none !important;">
            <div class="card-body p-4">
                <h5 class="fw-bold text-warning mb-3">☀️ 결합된 현실 맥락 (경험)</h5>
                <div id="experience-cards-container" class="d-flex flex-column gap-2">
                </div>
            </div>
        </div>

        <div class="card bg-dark border-primary mb-5 shadow-sm" style="transform: none !important;">
            <div class="card-body p-4">
                <h5 class="fw-bold text-primary-custom mb-3">🤖 AI 무의식 분석 리포트</h5>

                <div id="analysis-keywords" class="d-flex flex-wrap gap-2 mb-4">
                </div>

                <div id="ai-report-text" class="text-light-emphasis" style="line-height: 1.9; white-space: pre-wrap;">
                    AI 분석 결과를 분석하는 중입니다...
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-3 bg-black text-secondary small mt-auto">
        본 해석은 AI 기반이며, 전문적 심리 상담을 대체하지 않습니다.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/analysis-result.js"></script>
</body>

</html>
