<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 꿈일기 작성 - Dreamlens</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
    
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1 max-w-md" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <h2 class="fw-bold mb-0">새 꿈일기 기록하기</h2>
            <span id="save-status">대기 중...</span>
        </div>

        <div class="editor-container shadow-sm">
            <form id="diary-form">
                <div class="mb-4">
                    <label for="diary-date" class="form-label text-secondary fw-semibold">날짜</label>
                    <input type="date" class="form-control bg-dark text-light border-secondary" id="diary-date" required>
                </div>

                <div class="mb-3">
                    <label for="diary-content" class="form-label text-secondary fw-semibold">꿈 내용</label>
                    <textarea class="form-control bg-dark text-light border-secondary" id="diary-content" rows="12" 
                              placeholder="오늘 어떤 꿈을 꾸셨나요? 최대한 생생하게 적어주세요. (최소 20자 이상)" 
                              minlength="20" maxlength="2000" required></textarea>
                </div>
                
                <div class="text-end mb-4 text-secondary small">
                    <span id="char-count">0</span> / 2,000자
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary px-4" onclick="location.href='../index.html'">취소</button>
                    <button type="submit" class="btn btn-primary-custom px-4">정식 저장</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/diary-form.js"></script>
</body>
</html>
