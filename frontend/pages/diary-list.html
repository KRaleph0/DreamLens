<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 꿈일기 목록 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <!-- 뒤로가기 버튼 -->
        <a href="../index.html" class="text-secondary text-decoration-none me-3 fs-5" title="메인으로 가기">⬅️</a>
        <span class="navbar-brand fw-bold text-primary-custom mb-0 h1">🔎 Dreamlens</span>
    </nav>

    <main class="container flex-grow-1" style="max-width: 800px;">

        <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-4">
            <h2 class="fw-bold mb-0">내 꿈일기 목록</h2>

            <!-- ✨ 정렬 기준 선택 셀렉트박스 -->
            <select id="sort-select" class="form-select bg-dark text-light border-secondary w-auto shadow-sm">
                <option value="date-desc">최신순</option>
                <option value="date-asc">오래된순</option>
                <option value="alpha-asc">가나다순</option>
            </select>
        </div>

        <!-- 리스트가 렌더링 될 영역 -->
        <div id="full-diary-list" class="d-flex flex-column gap-3">
            <div class="text-center py-5 text-secondary">
                <div class="spinner-border text-primary-custom" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-secondary small mt-5">
        Dreamlens - 당신의 무의식 저장소
    </footer>

    <!-- 상세보기 모달용 JS 임시 함수 -->
    <script>
        function showDreamDetail(id) {
            const dreamList = JSON.parse(localStorage.getItem('dreamList') || '[]');
            const dream = dreamList.find(d => d.id === id);
            if (dream) alert(`[${dream.date} 기록]\n\n${dream.content}`);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/diary-list.js"></script>
</body>

</html>
