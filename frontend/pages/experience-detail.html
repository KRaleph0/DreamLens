<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경험 상세 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .exp-paper {
            background-color: #212529;
            border-left: 4px solid #0d6efd;
            /* 경험 파트는 파란색 톤으로 포인트 */
            line-height: 1.8;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1" style="max-width: 700px;">
        <div id="detail-container">
            <div class="text-center py-5 text-secondary">
                <div class="spinner-border text-primary-custom" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="d-flex justify-content-end gap-2 mt-4" id="action-buttons" style="display: none !important;">
            <button id="btn-edit" class="btn btn-outline-secondary">수정</button>
            <button id="btn-delete" class="btn btn-outline-danger">삭제</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/experience-detail.js?v=2"></script>
</body>

</html>
