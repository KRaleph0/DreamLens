<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 경험 기록 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* 입력창 포커스 시 노란색(Warning) 테두리 효과 */
        .form-control:focus,
        .form-select:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1 max-w-md" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <h2 id="form-page-title" class="fw-bold mb-0 text-warning">새 경험 기록하기</h2>
            <span id="save-status" class="text-secondary small">대기 중...</span>
        </div>

        <div class="card bg-dark border-secondary shadow-sm p-4 p-md-5 rounded-4">
            <form id="exp-form">
                <div class="mb-4">
                    <label for="exp-title" class="form-label text-secondary fw-semibold">경험 요약 (제목)</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="exp-title"
                        placeholder="예: 첫 자전거를 타던 날" required>
                </div>

                <div class="mb-4">
                    <label for="exp-time" class="form-label text-secondary fw-semibold">시간 태그 (필수)</label>
                    <select class="form-select bg-dark text-light border-secondary" id="exp-time" required>
                        <option value="" disabled selected>시기를 선택하세요</option>
                        <option value="childhood">유년기</option>
                        <option value="adolescence">청소년기</option>
                        <option value="adulthood">성인기</option>
                        <option value="recent">최근 (1년 이내)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="exp-content" class="form-label text-secondary fw-semibold">상세 내용</label>
                    <textarea class="form-control bg-dark text-light border-secondary" id="exp-content" rows="10"
                        placeholder="당시의 감정이나 상황을 자세히 적어주세요. (최소 10자 이상)" minlength="10" maxlength="2000"
                        required></textarea>
                </div>

                <div class="text-end mb-4 small text-secondary">
                    예상: <span id="exp-token-calc" class="fw-bold text-warning fs-5">0</span> 토큰
                </div>

                <div class="d-flex justify-content-end gap-2 mt-5">
                    <button type="button" class="btn btn-outline-secondary px-4 rounded-pill"
                        onclick="history.back()">취소</button>
                    <button type="submit" id="submit-btn" class="btn btn-warning fw-bold px-4 rounded-pill"
                        style="color: #212529;">등록하기</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/experience-form.js"></script>
</body>

</html>
