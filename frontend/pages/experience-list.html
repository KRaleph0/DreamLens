<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 경험 목록 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .hover-glow {
            transition: all 0.2s ease-in-out;
        }

        .hover-glow:hover {
            border-color: #ffc107 !important;
            /* 노란색/앰버 테두리 글로우 */
            background-color: #2b2f36 !important;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1" style="max-width: 800px;">

        <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-4">
            <h2 class="fw-bold mb-0">내 경험 목록</h2>
            <!-- ✨ 우측 상단에 폼으로 가는 버튼 추가 -->
            <button class="btn btn-warning fw-bold shadow-sm" style="color: #212529;"
                onclick="location.href='experience-form.html'">
                + 새 기록
            </button>
        </div>

        <!-- 리스트가 렌더링 될 영역 -->
        <div id="exp-list" class="d-flex flex-column gap-3">
            <div class="text-center py-5 text-secondary">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/experience-list.js"></script>
</body>

</html>
