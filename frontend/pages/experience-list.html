<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 경험 목록 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1" style="max-width: 800px;">

        <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-4">
            <h2 class="fw-bold mb-0">내 경험 목록</h2>

            <div class="d-flex gap-2">
                <button class="btn btn-warning fw-bold shadow-sm" style="color: #212529;"
                    onclick="location.href='experience-form.html'">
                    + 새 기록
                </button>
                <select id="sort-select" class="form-select bg-dark text-light border-secondary w-auto shadow-sm">
                    <option value="date-desc">최신순</option>
                    <option value="date-asc">오래된순</option>
                    <option value="alpha-asc">가나다순</option>
                </select>
            </div>
        </div>

        <div id="full-exp-list" class="d-flex flex-column gap-3 mb-5">
            <div class="text-center py-5 text-secondary">로딩 중...</div>
        </div>
    </main>

    <footer class="text-center py-4 text-secondary small mt-5">
        Dreamlens - 당신의 무의식 저장소
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/experience-list.js"></script>
</body>

</html>
