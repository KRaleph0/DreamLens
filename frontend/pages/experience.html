<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경험 관리 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1 max-w-md" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-end mb-3">
            <h2 class="fw-bold mb-0">나의 경험 기록장</h2>
            <!-- ✨ 추가됨: 자동 저장 상태 표시기 -->
            <span id="save-status" class="text-secondary small"></span>
        </div>
        <p class="text-secondary mb-5">꿈 분석의 재료가 될 실생활 경험이나 과거의 기억을 미리 등록해 두세요. (최대 1,000토큰 예산 고려)</p>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card p-4 shadow-sm h-100">
                    <h5 class="fw-bold mb-4 text-primary-custom">새 경험 등록</h5>
                    <form id="exp-form">
                        <div class="mb-3">
                            <label for="exp-title" class="form-label text-secondary small">경험 요약 (제목)</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="exp-title"
                                placeholder="예: 첫 자전거를 타던 날" required>
                        </div>

                        <div class="mb-3">
                            <label for="exp-time" class="form-label text-secondary small">시간 태그 (필수)</label>
                            <select class="form-select bg-dark text-light border-secondary" id="exp-time" required>
                                <option value="" disabled selected>시기를 선택하세요</option>
                                <option value="childhood">유년기</option>
                                <option value="adolescence">청소년기</option>
                                <option value="adulthood">성인기</option>
                                <option value="recent">최근 (1년 이내)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="exp-content" class="form-label text-secondary small">상세 내용</label>
                            <textarea class="form-control bg-dark text-light border-secondary" id="exp-content" rows="6"
                                placeholder="당시의 감정이나 상황을 자세히 적어주세요." required></textarea>

                            <div class="text-end mt-2 small text-secondary">
                                예상: <span id="exp-token-calc" class="fw-bold text-primary-custom">0</span> 토큰
                            </div>
                        </div>
                        <button type="submit"
                            class="btn btn-primary-custom w-100 py-2 fw-bold rounded-pill">등록하기</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-4 shadow-sm h-100">
                    <h5 class="fw-bold mb-4 text-primary-custom">내 경험 목록</h5>

                    <!-- ✨ 변경됨: 하드코딩된 데이터 제거, JS가 화면을 그리도록 비워둠 -->
                    <div id="exp-list" class="d-flex flex-column gap-3 overflow-auto" style="max-height: 500px;">
                        <div class="text-center py-5 text-secondary small">등록된 경험이 없습니다.</div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/experience.js"></script>
</body>

</html>
