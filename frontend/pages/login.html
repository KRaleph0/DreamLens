<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Dreamlens</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-body">

    <main class="auth-container">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary-custom cursor-pointer" onclick="location.href='../index.html'">🔎 Dreamlens
            </h2>
            <p class="text-secondary small">당신의 무의식을 탐험할 준비가 되셨나요?</p>
        </div>

        <div class="card auth-card shadow-lg">
            <div class="card-body p-4 p-md-5">

                <ul class="nav nav-pills nav-justified mb-4 auth-tabs" id="authTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="pill"
                            data-bs-target="#login-panel" type="button" role="tab">로그인</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="pill"
                            data-bs-target="#register-panel" type="button" role="tab">회원가입</button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabContent">

                    <!-- 로그인 탭 패널 -->
                    <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-email" class="form-label text-secondary small">이메일</label>
                                <input type="email" class="form-control bg-dark text-light border-secondary"
                                    id="login-email" required>
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label text-secondary small">비밀번호</label>
                                <input type="password" class="form-control bg-dark text-light border-secondary"
                                    id="login-password" required>
                            </div>

                            <!-- ✨ 새로 추가된 자동 로그인 체크박스 (기본적으로 체크된 상태) -->
                            <div class="form-check mb-4">
                                <input class="form-check-input bg-dark border-secondary" type="checkbox" id="auto-login"
                                    checked>
                                <label class="form-check-label text-secondary small" for="auto-login">
                                    자동 로그인
                                </label>
                            </div>

                            <button type="submit"
                                class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold">로그인</button>
                        </form>
                    </div>

                    <!-- 회원가입 탭 패널 -->
                    <div class="tab-pane fade" id="register-panel" role="tabpanel">
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="reg-email" class="form-label text-secondary small">이메일</label>
                                <input type="email" class="form-control bg-dark text-light border-secondary"
                                    id="reg-email" required>
                            </div>
                            <div class="mb-3">
                                <label for="reg-password" class="form-label text-secondary small">비밀번호</label>
                                <input type="password" class="form-control bg-dark text-light border-secondary"
                                    id="reg-password" required>
                            </div>
                            <div class="mb-3">
                                <label for="reg-nickname" class="form-label text-secondary small">닉네임</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary"
                                    id="reg-nickname" required>
                            </div>
                            <div class="row mb-4">
                                <div class="col-6">
                                    <label for="reg-gender" class="form-label text-secondary small">성별</label>
                                    <select class="form-select bg-dark text-light border-secondary" id="reg-gender"
                                        required>
                                        <option value="" disabled selected>선택</option>
                                        <option value="M">남성</option>
                                        <option value="F">여성</option>
                                        <option value="O">기타</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="reg-age" class="form-label text-secondary small">연령대</label>
                                    <select class="form-select bg-dark text-light border-secondary" id="reg-age"
                                        required>
                                        <option value="" disabled selected>선택</option>
                                        <option value="10">10대</option>
                                        <option value="20">20대</option>
                                        <option value="30">30대</option>
                                        <option value="40">40대 이상</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit"
                                class="btn btn-primary-custom w-100 py-2 rounded-pill fw-bold">가입하기</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
