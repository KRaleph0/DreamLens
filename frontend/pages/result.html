<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 결과 - Dreamlens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar border-bottom border-secondary-subtle px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold text-primary-custom" href="../index.html">🔎 Dreamlens</a>
    </nav>

    <main class="container flex-grow-1 max-w-md" style="max-width: 800px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge bg-primary mb-2">✨ 간단 해몽</span>
                <h2 class="fw-bold mb-0" id="dream-date">불러오는 중...</h2>
            </div>
            <div class="text-end text-secondary small" id="analysis-date"></div>
        </div>

        <div class="card p-4 shadow-sm mb-4 border-secondary-subtle">
            <h5 class="fw-bold mb-3">🔑 핵심 키워드</h5>
            <div id="keyword-primary" class="d-flex flex-wrap gap-2 mb-2"></div>
            <h5 class="fw-bold mb-3 mt-2">🔵 보조 키워드</h5>
            <div id="keyword-secondary" class="d-flex flex-wrap gap-2 mb-2"></div>
            <h5 class="fw-bold mb-3 mt-2">⚪ 배경 키워드</h5>
            <div id="keyword-tertiary" class="d-flex flex-wrap gap-2"></div>
        </div>

        <div class="card p-4 shadow-sm mb-4 border-secondary-subtle">
            <h5 class="fw-bold mb-3 text-primary-custom">📜 해석 결과</h5>
            <div id="interpretation-content" class="text-light" style="line-height: 1.8;">
                불러오는 중...
            </div>
        </div>

        <div class="d-flex gap-2 justify-content-end mb-5">
            <button class="btn btn-outline-light" onclick="location.href='../index.html'">메인으로</button>
            <button class="btn btn-primary-custom">결과 공유하기</button>
        </div>

    </main>

    <footer class="bg-dark border-top border-secondary-subtle py-3 mt-auto text-center">
        <p class="text-secondary small mb-0">
            ⚠️ <strong>안내:</strong> 본 해석은 AI 모델에 의해 생성된 참고용 데이터이며, 의학적/전문적 심리 상담을 대체할 수 없습니다.
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/result.js"></script>
</body>
</html>
